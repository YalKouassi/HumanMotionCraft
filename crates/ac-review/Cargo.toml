[package]
name = "ac-review"
description = "Training data review (developers only, never shipped): play the retargeted takes, see the quality scan's flags, keep, cut, reject or relabel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ac-review"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
ac-core.workspace = true
ac-render.workspace = true
craft-atomic.workspace = true
crc32fast = "1.5"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.37"
serde.workspace = true
serde_json.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
