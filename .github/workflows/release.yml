# The app's release, in the form Craft Unofficial Launcher installs (craft-app.json at the repo
# root; the contract is JOINING.md in github.com/YalKouassi/craft-bridge).
#
# Push a tag `v<version>` (the version in Cargo.toml) to publish. Run it by hand
# (workflow_dispatch) to build and check the release folder without publishing: the folder is
# uploaded as a workflow artifact instead.
#
# The release attaches:
#   humanmotioncraft-<version>-windows-x64-portable.zip  (one folder: the app, `ac.exe`, assets/,
#                                                        the licence files, and what the optional
#                                                        helpers' installs read, in the source
#                                                        tree's layout)
#   craft-app.json, its icon (assets/icon/), SHA256SUMS.txt
# It is created as a draft, uploaded, then published as the latest release, so an interrupted run
# never leaves a half-uploaded public one. Data releases (training/ac_train/publish.py) are
# prereleases and never take "latest" from it.
#
# The zip's contents are checked against tools/release_manifest.txt here; the clean-machine check
# (tools/release_check.ps1, Windows Sandbox: tools/release_check.wsb) is run by hand on the zip,
# see roadmap/124000-packaging.md.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # The craft-bridge commit whose bridge.py checks the release (pinned, not main).
  BRIDGE_REF: 9732a88b3530e34ff3e3d9960061c2f14dc39037

jobs:
  windows:
    name: build, check and publish (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then echo "no version in Cargo.toml" >&2; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "tag $tag does not match Cargo.toml's version $version" >&2; exit 1
            fi
          else
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build
        env:
          # The launcher refuses a portable exe without version info, so a missing resource
          # compiler fails the release instead of shipping one (crates/ac-app/build.rs).
          HUMANMOTIONCRAFT_REQUIRE_WINRES: "1"
        run: cargo build --release --locked -p ac-app -p ac-cli

      - name: check the version info
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = (Get-Item target/release/humanmotioncraft.exe).VersionInfo.ProductVersion
          if ($v -ne $env:VERSION) { throw "humanmotioncraft.exe's ProductVersion is '$v', not $env:VERSION" }

      - name: release folder
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          id=$(jq -r .id craft-app.json)
          stem="$id-$VERSION-windows-x64-portable"
          mkdir -p "dist" "target/package/$stem"
          cp "target/release/$id.exe" target/release/ac.exe "target/package/$stem/"
          cp -r assets "target/package/$stem/assets"
          cp LICENSE NOTICE ATTRIBUTION.md README.md "target/package/$stem/"
          # text.install and posefill.install run these from next to assets/ (ac_helper::setup);
          # the setups read the product's name from product.rs and copy the rig maths
          pkg="target/package/$stem"
          mkdir -p "$pkg/tools/textmotion" "$pkg/tools/posefill" "$pkg/training/ac_train" "$pkg/crates/ac-core/src"
          # (tools/release_manifest.txt lists the same files: keep the two in step)
          cp tools/textmotion/{setup_textmotion,helper,generate,engine}.py "$pkg/tools/textmotion/"
          # posefill.samples runs setup_samples.py, which imports setup_posefill and runs convert_samples.py
          cp tools/posefill/{setup_posefill,helper,engine,live,setup_samples,convert_samples}.py tools/posefill/LICENSE-APACHE "$pkg/tools/posefill/"
          # RIG_MODULES of both setups (bvh.py is pose fill's and the sample clips')
          cp training/ac_train/{rig,quat,retarget,bvh}.py "$pkg/training/ac_train/"
          cp crates/ac-core/src/product.rs "$pkg/crates/ac-core/src/"
          # Python's zipfile writes `/` separators (Compress-Archive may write `\`, which the
          # launcher refuses; Git Bash's tar can't write zips).
          (cd target/package && python -I -m zipfile -c "../../dist/$stem.zip" "$stem")
          cp craft-app.json "assets/icon/$id-256.png" dist/

      - name: check the zip's contents
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # every path tools/release_manifest.txt requires is in the zip, and nothing it forbids
          $id = (Get-Content craft-app.json | ConvertFrom-Json).id
          & tools/release_contents.ps1 -Path "dist/$id-$env:VERSION-windows-x64-portable.zip"
          if ($LASTEXITCODE -ne 0) { throw "the zip's contents don't match tools/release_manifest.txt" }

      - name: check against the launcher's contract
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSL -o target/bridge.py "https://raw.githubusercontent.com/YalKouassi/craft-bridge/$BRIDGE_REF/bridge.py"
          python -I target/bridge.py --sums dist
          python -I target/bridge.py --check dist --repo "$GITHUB_REPOSITORY" --tag "$TAG"

      - name: keep the folder (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: dist/

      - name: publish
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$(jq -r .name craft-app.json) $TAG" --generate-notes
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
